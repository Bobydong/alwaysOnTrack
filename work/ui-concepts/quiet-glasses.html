<div id="quiet-glasses-study">
  <style>
    #quiet-glasses-study .display-stage{padding:18px 8px 24px;min-height:360px}
    #quiet-glasses-study .g2-study{--ink:#9be4b1;--glass:#07130c;--inset:24px;position:relative;box-sizing:border-box;width:100%;height:320px;background:var(--glass);color:var(--ink);font:400 19px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}
    #quiet-glasses-study .g2-study *{box-sizing:border-box}
    #quiet-glasses-study .g2-block{position:absolute;max-width:43%;display:flex;flex-direction:column;gap:7px}
    #quiet-glasses-study .g2-label{font-size:12px;letter-spacing:.10em;text-transform:uppercase;font-weight:400}
    #quiet-glasses-study .g2-name{font-size:21px;font-weight:500;overflow-wrap:anywhere}
    #quiet-glasses-study .g2-meta{font-size:14px}
    #quiet-glasses-study .g2-icon-label{display:flex;align-items:center;gap:9px}
    #quiet-glasses-study .g2-icon-label svg{flex-shrink:0;width:18px;height:18px;stroke-width:1.6}
    #quiet-glasses-study .g2-tl{top:var(--inset);left:var(--inset)}
    #quiet-glasses-study .g2-tr{top:var(--inset);right:var(--inset);text-align:right;align-items:flex-end}
    #quiet-glasses-study .g2-bl{bottom:var(--inset);left:var(--inset)}
    #quiet-glasses-study .g2-br{bottom:var(--inset);right:var(--inset);text-align:right;align-items:flex-end}
    #quiet-glasses-study .g2-study[data-layout="edge"] .g2-tl{left:auto;right:var(--inset);text-align:right;align-items:flex-end;max-width:68%}
    #quiet-glasses-study .g2-study[data-layout="edge"] .g2-tr{top:142px;max-width:68%}
    #quiet-glasses-study .g2-study[data-layout="edge"] .g2-tr .g2-name{font-size:17px}
    #quiet-glasses-study .g2-study[data-layout="edge"] .g2-bl{left:auto;right:var(--inset);bottom:60px;text-align:right;align-items:flex-end;max-width:75%}
    #quiet-glasses-study .g2-study[data-layout="edge"] .g2-br{max-width:75%}
    #quiet-glasses-study .g2-study.no-icons .g2-icon-label svg{display:none}
    #quiet-glasses-study .g2-study[data-state="approach"] .g2-tr .g2-name{text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
    #quiet-glasses-study .g2-study[data-state="arrival"] .g2-tr .g2-name{font-size:17px}
    @media(max-width:450px){
      #quiet-glasses-study .g2-study{--inset:16px;height:320px}
      #quiet-glasses-study .g2-name{font-size:17px}
      #quiet-glasses-study .g2-meta{font-size:12px}
      #quiet-glasses-study .g2-label{font-size:11px;letter-spacing:.05em}
      #quiet-glasses-study .g2-block{max-width:44%;gap:6px}
      #quiet-glasses-study .g2-icon-label{gap:5px}
      #quiet-glasses-study .g2-icon-label svg{width:16px;height:16px}
    }
  </style>
  <div class="viz-controls">
    <label class="form-label">Journey moment
      <select class="form-select" id="quiet-journey-state">
        <option value="riding">Riding</option><option value="boarding">Boarding</option>
        <option value="approach">Approaching your stop</option><option value="arrival">Arrival detected</option>
      </select>
    </label>
  </div>
  <div class="viz-carousel viz-dotted-background" aria-label="Quiet glasses layout directions">
    <section data-variant="Quiet corners" aria-label="Quiet corners layout">
      <div class="display-stage">
        <div class="g2-study" data-layout="corners" data-state="riding" aria-label="Quiet corners glasses display" role="img">
          <div class="g2-block g2-tl"><span class="g2-label g2-icon-label"><i data-lucide="train-front" aria-hidden="true"></i><span data-field="primary-label">Next station</span></span><span class="g2-name" data-field="primary">23 St</span></div>
          <div class="g2-block g2-tr"><span class="g2-label" data-field="secondary-label">Get off at</span><span class="g2-name" data-field="secondary">14 St</span></div>
          <div class="g2-block g2-bl"><span class="g2-meta g2-icon-label"><i data-lucide="circle-dot" aria-hidden="true"></i><span data-field="status">Detection opens in 10s</span></span></div>
          <div class="g2-block g2-br"><span class="g2-meta" data-field="count">Stop 1 / 3</span></div>
        </div>
      </div>
    </section>
    <section data-variant="Quiet edge" aria-label="Quiet edge layout" hidden>
      <div class="display-stage">
        <div class="g2-study" data-layout="edge" data-state="riding" aria-label="Quiet edge glasses display" role="img">
          <div class="g2-block g2-tl"><span class="g2-label g2-icon-label"><i data-lucide="train-front" aria-hidden="true"></i><span data-field="primary-label">Next station</span></span><span class="g2-name" data-field="primary">23 St</span></div>
          <div class="g2-block g2-tr"><span class="g2-label" data-field="secondary-label">Get off at</span><span class="g2-name" data-field="secondary">14 St</span></div>
          <div class="g2-block g2-bl"><span class="g2-meta g2-icon-label"><i data-lucide="circle-dot" aria-hidden="true"></i><span data-field="status">Detection opens in 10s</span></span></div>
          <div class="g2-block g2-br"><span class="g2-meta" data-field="count">Stop 1 / 3</span></div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('quiet-glasses-study');
      const picker = root.querySelector('#quiet-journey-state');
      const scenes = {
        riding: {'primary-label':'Next station',primary:'23 St','secondary-label':'Get off at',secondary:'14 St',status:'Detection opens in 10s',count:'Stop 1 / 3'},
        boarding: {'primary-label':'Board at',primary:'34 St–Herald Sq','secondary-label':'Downtown F',secondary:'Toward Brooklyn',status:'Tap once aboard',count:''},
        approach: {'primary-label':'Next station',primary:'14 St','secondary-label':'Get off at',secondary:'14 St',status:'Waiting to stop',count:'Stop 2 / 3'},
        arrival: {'primary-label':'You’ve arrived',primary:'14 St','secondary-label':'Exit',secondary:'Follow exit signs',status:'Tap if not at 14 St',count:'20s to confirm'}
      };
      const saved = window.openai?.widgetState;
      let moment = scenes[saved?.modelContent?.moment] ? saved.modelContent.moment : 'riding';
      const tweaks = new Map();
      root.querySelectorAll('.g2-study').forEach(display => tweaks.set(display, {icons:true,inset:24}));
      function render(){
        picker.value = moment;
        root.querySelectorAll('.g2-study').forEach(display => {
          const state = tweaks.get(display); display.dataset.state=moment;
          display.classList.toggle('no-icons',!state.icons); display.style.setProperty('--inset',`${state.inset}px`);
          display.querySelectorAll('[data-field]').forEach(el => el.textContent=scenes[moment][el.dataset.field]);
          display.setAttribute('aria-label',`${display.dataset.layout} layout: ${Object.values(scenes[moment]).filter(Boolean).join('. ')}`);
        });
      }
      picker.addEventListener('change',()=>{
        moment=picker.value; render();
        window.openai?.setWidgetState?.({modelContent:{moment},privateContent:null})?.catch(()=>{});
      });
      window.addEventListener('openai:set_globals',event=>{
        const choice=event.detail?.globals?.widgetState?.modelContent?.moment;
        if(scenes[choice]){moment=choice;render();}
      });
      render();
      if(globalThis.Tweak) tweaks.forEach((state,display)=>{
        const tweak=new Tweak({container:display,onChange:render});
        tweak.addToggle(state,'icons',{label:'Small status icons'});
        tweak.addSlider(state,'inset',{label:'Edge spacing',min:16,max:32,unit:'px'});
      });
    })();
  </script>
</div>
